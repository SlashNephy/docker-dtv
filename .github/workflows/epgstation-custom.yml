name: epgstation-custom

on:
  push:
    paths:
      - "src/epgstation-custom/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@d5bbbb58e94f3b25497f996ea141b31d6db26857 # v1.0.1
    with:
      image-name: ghcr.io/slashnephy/epgstation-custom
      context: src/epgstation-custom
