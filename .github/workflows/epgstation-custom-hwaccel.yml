name: epgstation-custom-hwaccel

on:
  push:
    paths:
      - "src/epgstation-custom-hwaccel/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@d5bbbb58e94f3b25497f996ea141b31d6db26857 # v1.0.1
    with:
      image-name: ghcr.io/slashnephy/epgstation-custom-hwaccel
      context: src/epgstation-custom-hwaccel
      dispatch-update-image-digest: true
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
