name: ffmpeg-debian

on:
  push:
    paths:
      - "src/ffmpeg/debian/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@4f8418a050cec08776dae7be3df42f5b13215933 # v1.0.2
    with:
      image-name: ghcr.io/slashnephy/ffmpeg-debian
      context: src/ffmpeg/debian
      image-platforms: linux/amd64,linux/arm64
