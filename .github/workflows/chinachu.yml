name: chinachu

on:
  push:
    paths:
      - "src/chinachu/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@cf12e2d382df42d9fcfc4ee94f901661d8255d19 # v0.0.7
    with:
      image-name: ghcr.io/slashnephy/chinachu
      context: src/chinachu
      image-platforms: linux/amd64,linux/arm64
